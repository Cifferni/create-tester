# ============================================================
# 用例格式说明(YAML,一个文件一个用例)
#
# 支持的步骤关键字:
#   打开:     页面地址(相对地址基于 url,或写完整 http 地址)
#   输入:     定位器 = 值(或 {定位: 选择器, 值: 内容})
#   点击:     定位器(如 #loginBtn / .btn / button:has-text("登录"))
#   等待:     2s(时间)/ 1000(毫秒)/ 选择器(等待元素可见)
#   断言页面: 要出现的文本(或 {文本: ...} / {元素可见: 选择器})
#   断言接口: {url: 接口关键字, 断言: [{字段: 路径, 条件: ==|!=|包含|非空|为空, 值: ...}]}
#   截图:     名称(可选,用于留档)
#   暂停:     描述(带界面执行时按回车继续,用于人工介入)
#
# 定位器优先用 id/class/data-testid,少用复杂 XPath
# ============================================================

用例: 登录成功
优先级: P0
# 被测页面地址(不写则用 tester.config.ts 里的 url)
url: http://localhost:3000/login
# 前置条件(说明,供阅读;可在这里写需要造的数据)
前置: 存在测试账号 test01 / 123456

步骤:
  # 没有"打开"步骤时会自动打开上面的 url;也可以用 打开: 指定其他页面
  - 打开: /login

  # ---- 打开登录页并登录 ----
  - 输入: '#username = test01'
  - 输入: '#password = 123456'
  - 点击: '#loginBtn'

  # ---- 校验登录触发的接口返回(核心:验证返回信息是否正确) ----
  - 断言接口:
      url: /api/login
      断言:
        - {字段: code, 条件: '==', 值: 0}
        - {字段: data.token, 条件: 非空}

  # ---- 校验页面跳转/展示 ----
  - 断言页面: 欢迎您
  - 断言接口:
      url: /api/user/info
      断言:
        - {字段: code, 条件: '==', 值: 0}
        - {字段: data.status, 条件: 非空}

  - 截图: 登录成功
